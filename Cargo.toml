[package]
name = "polytoken-acp"
version = "0.1.0"
edition = "2024"
description = "ACP (Agent Client Protocol) server shim for the Polytoken daemon"
license = "Apache-2.0"

[[bin]]
name = "polytoken-acp"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "1.2", features = ["unstable"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
futures = "0.3"
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
agent-client-protocol = { version = "1.2", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tempfile = "3"
